<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>读者管理</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <div class="container">
            <h1>📚 双鸭山图书管理系统</h1>
            <ul class="nav-links">
                <li><a href="{{ url_for('dashboard') }}">帮助</a></li>
                <li><a href="{{ url_for('books') }}">图书管理</a></li>
                <li><a href="{{ url_for('borrow') }}">借阅管理</a></li>
                <li><a href="{{ url_for('logout') }}">退出 ({{ session.username }})</a></li>
            </ul>
        </div>
    </header>

    <div class="container">
        <div class="main-content">
            <h2>👥 读者列表</h2>

            <!-- 添加读者表单 -->
            <details style="margin: 20px 0; border: 1px solid #e9ecef; border-radius: 8px; background: #f8f9fa;">
                <summary style="cursor: pointer; padding: 16px; font-weight: bold; color: #3498db; list-style: none; outline: none;">
                    ➕ 添加新读者</summary>
                <div style="padding: 20px; border-top: 1px solid #eee;">
                    <form method="post" action="{{ url_for('add_reader') }}">
                        <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                            <div class="form-group">
                                <label>姓名</label>
                                <input type="text" name="name" required>
                            </div>
                            <div class="form-group">
                                <label>手机号</label>
                                <input type="text" name="phone" required pattern="1[3-9]\d{9}" title="请输入11位中国大陆手机号">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success" style="margin-top: 15px;">添加读者</button>
                    </form>
                </div>
            </details>

            <!-- 读者搜索框 -->
            <div style="margin: 20px 0; padding: 15px; background: #f9f9f9; border-radius: 8px;">
                <form method="get" action="{{ url_for('readers') }}" style="display: flex; gap: 10px; flex-wrap: wrap; align-items: end;">
                    <div>
                        <label for="search_query">🔍 搜索读者</label>
                        <input 
                            type="text" 
                            id="search_query"
                            name="q" 
                            value="{{ request.args.get('q', '') }}" 
                            placeholder="ID / 姓名 / 手机号"
                            style="padding: 6px 10px; width: 220px; border: 1px solid #ccc; border-radius: 4px;"
                        >
                    </div>
                    <button type="submit" class="btn btn-primary" style="padding: 6px 16px;">搜索</button>
                    {% if request.args.get('q') %}
                    <a href="{{ url_for('readers') }}" class="btn" style="padding: 6px 16px; text-decoration: none; background: #eee;">清空</a>
                    {% endif %}
                </form>
            </div>

            <!-- 读者表格 -->
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>姓名</th>
                        <th>手机号</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    {% for reader in readers %}
                    <tr>
                        <td data-label="ID">{{ reader[0] }}</td>
                        <td data-label="姓名">{{ reader[1] }}</td>
                        <td data-label="手机号">{{ reader[2] }}</td>
                        <td data-label="操作">
                            <form method="POST" action="{{ url_for('delete_reader', reader_id=reader[0]) }}"
                                style="display:inline;" onsubmit="return confirm('确定要删除读者【{{ reader[1] }}】吗？此操作不可恢复！')">
                                <button type="submit" class="btn btn-danger">删除</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
